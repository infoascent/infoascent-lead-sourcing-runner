# Lance chaque matin le sourcing de leads InfoAscent. Le code vit dans un repo privé ;
# ce repo ne contient que ce fichier. La sortie ne montre que des compteurs.
name: sourcing
on:
  # Le passage part la veille au soir pour que les leads soient là à 7 h, première tâche de la journée.
  # Il dure jusqu'à 5 h 30. GitHub retarde souvent les lancements planifiés (6 h de retard le 2026-09-30) :
  # minutes décalées, et deux créneaux de secours. Le premier passage du cycle (18 h - 18 h, heure de
  # Paris) fait sortir les suivants en moins d'une minute (règle --once-a-day).
  schedule:
    - cron: '13 17 * * *'   # 19 h 13 à Paris l'été, 18 h 13 l'hiver
    - cron: '43 19 * * *'   # secours
    - cron: '17 22 * * *'   # secours, dernier départ qui finit avant 7 h
  workflow_dispatch:
    inputs:
      target:
        description: 'Test : total visé dans À contacter (vide = passage normal)'
        required: false
concurrency: sourcing
permissions:
  contents: read
  actions: write   # uniquement pour se réactiver (voir la dernière étape)
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
        with:
          repository: infoascent/infoascent-lead-sourcing
          ssh-key: ${{ secrets.DEPLOY_KEY }}
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --silent
      - run: npx playwright install --with-deps chromium > /dev/null
      - run: node run.mjs ${{ inputs.target && format('--target {0}', inputs.target) || '--once-a-day' }}
        env:
          CLOUD: '1'
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      # GitHub coupe les lancements planifiés d'un repo public sans activité depuis 60 jours.
      # Se réactiver à chaque passage remet le compteur à zéro.
      - if: always()
        run: gh api -X PUT repos/${{ github.repository }}/actions/workflows/sourcing.yml/enable
        env:
          GH_TOKEN: ${{ github.token }}
